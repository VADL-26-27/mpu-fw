CONFIG_MCUX_HW_DEVICE_PART_MIMX8ML8DVNLZ=y

# Keep SDK board support
CONFIG_MCUX_PRJSEG_module.board.boardfile=y
CONFIG_MCUX_PRJSEG_module.board.clock=y
CONFIG_MCUX_PRJSEG_module.board.suite=y

# Use custom pin mux
CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder=y

# Use custom hardware initialization
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y

# Use pwm driver in ipwm
CONFIG_MCUX_COMPONENT_driver.ipwm=y